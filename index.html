<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATA Studio CRM</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#18202b;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}aside{background:#18212d;color:white;padding:24px 14px}.brand{font-size:23px;font-weight:850;letter-spacing:.05em;padding:10px 10px 30px}.brand small{display:block;color:#9eacbe;font-size:10px;letter-spacing:.09em;margin-top:8px}nav{display:grid;gap:6px}button{font:inherit;cursor:pointer}nav button{border:0;background:transparent;color:#d4dce7;text-align:left;padding:13px;border-radius:10px}nav button.active,nav button:hover{background:#354253}main{padding:30px;min-width:0;max-width:1450px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}h1{margin:0;font-size:28px}.sub{color:#818b9a;font-size:12px}.notice{background:#fff6e5;color:#73551f;border-left:3px solid #c59b55;padding:13px;margin-bottom:20px;border-radius:7px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e5e8ec;border-radius:14px;padding:20px}.value{font-size:28px;font-weight:800;margin-top:14px}.section{margin-top:20px}h2{font-size:17px}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}input{border:1px solid #d9dfe5;border-radius:9px;padding:11px 12px;max-width:100%;width:300px;font:inherit}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}td,th{padding:13px 8px;border-bottom:1px solid #eef0f3}th{color:#818b9a;font-size:11px;text-transform:uppercase}.scroll{overflow:auto}.pill{background:#edf1f6;border-radius:20px;padding:5px 9px;font-size:11px}.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.modules p{color:#818b9a;font-size:13px;line-height:1.5}.small{font-size:12px;color:#818b9a}.action{background:#fff;border:1px solid #dce1e6;padding:8px 10px;border-radius:8px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}aside{padding:10px}.brand{font-size:18px;padding:8px}.brand small{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;font-size:12px;padding:10px}main{padding:16px}header{align-items:flex-start;flex-direction:column}.card{padding:14px}}@media(max-width:390px){.metrics,.modules{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand">MATA STUDIO<small>CUSTOMER RELATIONSHIP MANAGEMENT</small></div><nav id="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="customers">Customers</button><button data-view="purchases">Purchases</button><button data-view="style">Style Passport</button><button data-view="modules">Modules</button></nav></aside><main><header><div><div class="sub">MATA STUDIO / CRM</div><h1 id="title">Dashboard</h1></div><span class="pill">Development preview</span></header><div class="notice">Demo only — fictional customer records. No POS integration, real customer data, or authentication enabled.</div><div id="content"></div></main></div><script>
const customers=[{id:"DEMO-001",name:"Maria Santos",tier:"VIP",spent:28500,style:"Classic / Neutral"},{id:"DEMO-002",name:"Andrea Cruz",tier:"Regular",spent:8200,style:"Minimal / Casual"},{id:"DEMO-003",name:"Nicole Reyes",tier:"New",spent:2450,style:"Modern / Bold"}];
const mods=[["Customer 360","Demo active","Customer search and profile overview"],["Purchase History","Pending integration","Read-only POS transaction history"],["Style Passport","Demo active","Sizes and personal preferences"],["Atelier","Planned","Alterations and made-to-order tracking"],["Loyalty","Planned","Rewards with reversal-safe ledger"],["Campaigns","Planned","Consent-aware follow-ups"],["Analytics","Planned","Retention and customer insights"],["Settings & Audit","Planned","Permissions and access history"]];
const fmt=n=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP",maximumFractionDigits:0}).format(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const content=document.getElementById("content");
function rows(cs){return cs.length?cs.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong><div class="small">'+esc(c.id)+'</div></td><td><span class="pill">'+esc(c.tier)+'</span></td><td>'+fmt(c.spent)+'</td><td><button class="action" data-customer="'+esc(c.id)+'">View</button></td></tr>').join(""):'<tr><td colspan="4">No customers found</td></tr>'}
function table(cs){return '<div class="scroll"><table><thead><tr><th>Customer</th><th>Segment</th><th>Lifetime value</th><th></th></tr></thead><tbody id="rows">'+rows(cs)+'</tbody></table></div>'}
function render(view){document.getElementById("title").textContent=({dashboard:"Dashboard",customers:"Customers",purchases:"Purchases",style:"Style Passport",modules:"Modules"})[view];document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="dashboard")content.innerHTML='<div class="metrics">'+[["Demo customers",customers.length],["Demo lifetime sales",fmt(customers.reduce((s,c)=>s+c.spent,0))],["VIP members",1],["Active modules",2]].map(([a,b])=>'<div class="card"><div class="sub">'+a+'</div><div class="value">'+b+'</div></div>').join("")+'</div><div class="card section"><h2>Customer overview</h2>'+table(customers)+'</div>';if(view==="customers")content.innerHTML='<div class="card"><div class="flex"><h2>Customer directory</h2><input id="search" placeholder="Search customers" aria-label="Search customers"></div>'+table(customers)+'<div id="detail"></div></div>';if(view==="purchases")content.innerHTML='<div class="card"><h2>Purchase history</h2><p class="small">No live transactions connected. Future data will be read-only, linked by CustomerID, and adjusted for reversals.</p></div>';if(view==="style")content.innerHTML='<div class="card"><h2>Style Passport</h2>'+customers.map(c=>'<p><strong>'+esc(c.name)+'</strong> — '+esc(c.style)+'</p>').join("")+'</div>';if(view==="modules")content.innerHTML='<div class="modules">'+mods.map(m=>'<div class="card"><div class="small">'+esc(m[1])+'</div><h2>'+esc(m[0])+'</h2><p>'+esc(m[2])+'</p></div>').join("")+'</div>';const input=document.getElementById("search");if(input)input.addEventListener("input",()=>{const q=input.value.toLowerCase();document.getElementById("rows").innerHTML=rows(customers.filter(c=>(c.name+" "+c.id+" "+c.tier).toLowerCase().includes(q)));document.getElementById("detail").textContent=""})}
document.addEventListener("click",e=>{const n=e.target.closest("[data-view]");if(n)render(n.dataset.view);const b=e.target.closest("[data-customer]");if(b){const c=customers.find(x=>x.id===b.dataset.customer),d=document.getElementById("detail");if(c&&d)d.innerHTML='<div class="card section"><h2>'+esc(c.name)+'</h2><p>Customer ID: '+esc(c.id)+'</p><p>Tier: '+esc(c.tier)+'</p><p>Style: '+esc(c.style)+'</p><p>Demo spending: '+fmt(c.spent)+'</p></div>'}});render("dashboard");
</script></body></html>
