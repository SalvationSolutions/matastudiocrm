<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f7"><title>MATA Studio · CRM</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#262421;background:#faf9f7;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ac8966;outline-offset:2px}.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100dvh}.sidebar{background:#fff;border-right:1px solid #eeebe7;padding:25px 13px;position:sticky;top:0;height:100dvh}.brand{text-align:center;letter-spacing:.19em;font-weight:750;font-size:16px;padding:8px 0 35px}.brand small{display:block;font-size:9px;letter-spacing:.25em;font-weight:500;margin-top:5px}.nav{display:grid;gap:5px}.nav button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:9px;background:transparent;color:#605d58;padding:12px 13px;font-size:13px}.nav button.active{background:#f2ebe3;color:#302b26;font-weight:650}.nav button:hover{background:#f8f5f1}.ico{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}.workspace{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid #efede9;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 28px}.topbar .mobile-brand{display:none}.top-right{display:flex;align-items:center;gap:15px}.search-top{background:#f7f6f4;border:1px solid #f0eeeb;border-radius:20px;padding:9px 14px;color:#827d77;font-size:12px;min-width:250px}.avatar{background:#d8c5b2;color:#44372b;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:11px}.page{padding:28px;max-width:1550px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:25px;letter-spacing:-.045em;margin:0;font-weight:720}h2{font-size:15px;letter-spacing:-.02em;margin:0}h3{font-size:13px;margin:0}.muted{color:#89847e}.small{font-size:11px}.eyebrow{font-size:11px;color:#8a837b;margin-bottom:6px}.pill{display:inline-flex;align-items:center;gap:5px;background:#f1ede8;color:#75614f;border-radius:20px;padding:5px 9px;font-size:10px;white-space:nowrap}.pill.green{background:#e9f3ea;color:#3f7b4e}.pill.blue{background:#eaf0f7;color:#55738c}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#292825;color:#fff;border:1px solid #292825;border-radius:10px;padding:10px 13px;font-size:12px;white-space:nowrap}.button.secondary{background:#fff;color:#393632;border-color:#e8e4de}.button:disabled{opacity:.5;cursor:not-allowed}.notice{font-size:11px;color:#78644f;background:#f7f1e8;border:1px solid #eee1cf;border-radius:9px;padding:11px 14px;margin-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #eeece8;border-radius:12px;padding:17px;min-width:0;box-shadow:0 2px 12px #24211b04}.metric-label{color:#837e77;font-size:11px}.metric-value{font-size:25px;letter-spacing:-.05em;font-weight:750;margin:12px 0 6px}.delta{color:#4d9560;font-size:10px}.dashboard-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;margin-top:13px}.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.link{color:#a47e5c;background:none;border:0;font-size:11px;padding:3px}.bars{height:155px;display:flex;align-items:end;gap:11px;border-bottom:1px solid #ede8e2;padding:0 4px}.bar{flex:1;background:linear-gradient(#c8a788,#e4d4c4);border-radius:3px 3px 0 0;min-width:0}.months{display:flex;justify-content:space-between;font-size:9px;color:#8f8983;margin-top:9px}.segments{display:grid;gap:13px}.segment{display:flex;align-items:center;gap:9px;font-size:12px}.dot{width:9px;height:9px;background:#c8a788;border-radius:50%}.segment b{margin-left:auto}.lower-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;margin-top:13px}.customer-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #f0eeeb}.customer-row:last-child{border:0}.initials{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#efe5da;color:#7a614c;font-size:11px;flex:none;font-weight:650}.grow{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tablewrap{overflow-x:auto;width:100%}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}th{color:#96918b;font-size:10px;font-weight:600;background:#faf9f7}td,th{padding:13px 12px;border-bottom:1px solid #f0eeeb}td:last-child,th:last-child{text-align:right}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.field{border:1px solid #e8e5e0;border-radius:9px;padding:11px 12px;background:#fff;color:#36322e;min-width:0;max-width:100%;width:100%;font-size:12px}.field-search{max-width:360px}.filters{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #eeeae5;border-radius:20px;padding:8px 11px;background:#fff;color:#77716a;font-size:11px}.chip.active{background:#eee5db;border-color:#eee5db;color:#4d3d2f}.profile-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:13px}.profile-center{text-align:center}.profile-avatar{width:78px;height:78px;border-radius:50%;background:#e8d6c4;display:grid;place-items:center;font-size:27px;color:#70543b;margin:0 auto 14px}.profile-fact{font-size:12px;padding:10px 0;border-bottom:1px solid #f1eeea;overflow-wrap:anywhere}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:13px}.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 12px;white-space:nowrap;font-size:11px;color:#807971}.tab.active{border-color:#b99a7c;color:#28231f;font-weight:650}.stats-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:13px}.stats-mini .card{padding:14px}.stats-mini strong{display:block;margin-top:8px;font-size:17px}.empty{padding:35px 12px;text-align:center;color:#8a837c;font-size:12px}.campaign-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px}.form-group{margin:15px 0}.form-group label{display:block;font-size:11px;font-weight:650;margin-bottom:8px}.choice{display:flex;align-items:center;gap:12px;border:1px solid #ede9e4;border-radius:10px;padding:13px;margin:9px 0}.choice .ico{color:#9c816a}.choice input{margin-left:auto;accent-color:#9c816a}.preview{border:1px solid #eae4dd;border-radius:10px;overflow:hidden}.preview-hero{background:#e9d9c9;text-align:center;padding:32px 12px}.preview-hero .brandline{letter-spacing:.24em;font-size:10px}.preview-hero strong{font-family:Georgia,serif;font-weight:400;display:block;font-size:27px;margin-top:16px}.preview-body{padding:22px;font-size:12px;line-height:1.8}.hamburger{display:none}.mobile-overlay{display:none}.mobile-close{display:none}
@media(max-width:1050px){.app{grid-template-columns:180px minmax(0,1fr)}.sidebar{padding:20px 9px}.nav button{padding:11px 9px}.page{padding:20px}.topbar{padding:0 20px}.profile-grid{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:900px){.app{display:block}.sidebar{position:fixed;left:0;top:0;width:235px;height:100dvh;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 30px #0000000c}.sidebar.open{transform:translateX(0)}.mobile-overlay.open{display:block;position:fixed;inset:0;background:#0005;z-index:20}.hamburger,.mobile-close{display:inline-flex;border:0;background:transparent;padding:7px;align-items:center;justify-content:center}.mobile-close{position:absolute;right:8px;top:8px}.topbar .mobile-brand{display:block;font-size:12px;font-weight:750;letter-spacing:.15em}.topbar{height:60px}.search-top{display:none}.page{padding:18px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.profile-grid{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:650px){.page{padding:14px}.pagehead{align-items:flex-start}h1{font-size:22px}.dashboard-grid,.lower-grid,.campaign-layout,.profile-grid{grid-template-columns:1fr}.stats-mini{grid-template-columns:repeat(3,minmax(0,1fr))}.metrics{gap:9px}.metric-value{font-size:22px}.card{padding:14px}.topbar{padding:0 12px}.pagehead .button{padding:9px}.tablewrap table{min-width:500px}.notice{font-size:10px}.stats-mini .card{padding:10px}.stats-mini strong{font-size:14px}}
@media(max-width:360px){.metrics{grid-template-columns:1fr}.stats-mini{grid-template-columns:1fr}}

</style></head><body>
<div class="mobile-overlay" id="overlay"></div><div class="app"><aside class="sidebar" id="sidebar"><button class="mobile-close" id="closeMenu" aria-label="Close menu">✕</button><div class="brand">MATA STUDIO<small>CRM</small></div><nav class="nav" id="nav"></nav></aside><div class="workspace"><div class="topbar"><button class="hamburger" id="menu" aria-label="Open navigation">☰</button><div class="mobile-brand">MATA STUDIO <span class="muted">/ CRM</span></div><div class="top-right"><span class="search-top">⌕ &nbsp; Search customers, email, phone...</span><span class="muted" aria-hidden="true">♧</span><div class="avatar">MA</div></div></div><main class="page"><div class="pagehead"><div><div class="eyebrow">MATA STUDIO / CRM</div><h1 id="pageTitle">Dashboard</h1></div><div id="pageAction"></div></div><div class="notice">Design preview with fictional data only. Guest records, POS sync and Gmail sending are not connected to this interface.</div><div id="content"></div></main></div></div>
<script>
const icons={dashboard:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',customers:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 5a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5"/>',guests:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',purchases:'<path d="M3 4h2l2 12h12l2-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',style:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',loyalty:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',campaigns:'<path d="M3 10v4h4l11 5V5L7 10H3zM7 14l1 6h3l-2-5M21 9v6"/>',reports:'<path d="M4 20V10M10 20V4M16 20v-9M22 20V7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>'};
const svg=k=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
const items=[['dashboard','Dashboard'],['customers','Customers'],['guests','Guest Database'],['purchases','Purchases'],['style','Style Passport'],['loyalty','Loyalty'],['campaigns','Email Campaigns'],['reports','Reports'],['settings','Settings']];
const people=[{id:'DEMO-001',name:'Maria Santos',email:'maria@example.com',phone:'+63 917 123 4567',tier:'VIP',spent:48320,visits:18,style:'Minimalist · Neutral tones',consent:'Subscribed'},{id:'DEMO-002',name:'James Tan',email:'james@example.com',phone:'+63 917 555 2100',tier:'Regular',spent:12450,visits:6,style:'Modern classic',consent:'Subscribed'},{id:'DEMO-003',name:'Liza Cruz',email:'liza@example.com',phone:'+63 917 555 2101',tier:'Atelier',spent:32180,visits:12,style:'Linen · Tailored',consent:'Unsubscribed'},{id:'DEMO-004',name:'Carla Reyes',email:'carla@example.com',phone:'+63 917 555 2102',tier:'Regular',spent:8920,visits:4,style:'Contemporary',consent:'Subscribed'},{id:'DEMO-005',name:'Daniel Kim',email:'daniel@example.com',phone:'+63 917 555 2103',tier:'New',spent:5680,visits:2,style:'Neutral',consent:'Pending'}];
const campaigns=[{name:'New Arrivals',status:'Draft',audience:'Subscribers',recipients:'—'},{name:'VIP Invitation',status:'Draft',audience:'VIP customers',recipients:'—'},{name:'Birthday Treat',status:'Draft',audience:'Birthday segment',recipients:'—'}];
const fmt=n=>'₱ '+Number(n).toLocaleString('en-PH'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='dashboard',filter='',segment='All',selected=people[0],profileTab='Overview';
const $=id=>document.getElementById(id),badge=(t)=>'<span class="pill '+(t==='Subscribed'?'green':t==='New'?'blue':'')+'">'+esc(t)+'</span>',initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
function card(title,body,extra=''){return '<section class="card"><div class="card-title"><h2>'+title+'</h2>'+extra+'</div>'+body+'</section>'}
function customerRows(list){return list.map(p=>'<tr><td><div style="display:flex;align-items:center;gap:9px"><span class="initials">'+initials(p.name)+'</span><div><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.email)+'</div></div></div></td><td>'+badge(p.tier)+'</td><td>'+p.visits+'</td><td>'+fmt(p.spent)+'</td><td><button class="link" data-profile="'+p.id+'">View →</button></td></tr>').join('')||'<tr><td colspan="5">No matching customers</td></tr>'}
function customerTable(list){return '<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Segment</th><th>Visits</th><th>Total spend</th><th></th></tr></thead><tbody>'+customerRows(list)+'</tbody></table></div>'}
function dashboard(){const vals=[['Total customers','1,248','+12%'],['New this month','86','+8%'],['Email subscribers','923','+15%'],['Campaigns sent','12','+0%']];return '<div class="metrics">'+vals.map(([l,v,d])=>'<div class="card"><div class="metric-label">'+l+'</div><div class="metric-value">'+v+'</div><span class="delta">'+d+' illustrative</span></div>').join('')+'</div><div class="dashboard-grid">'+card('Customer growth','<div class="bars">'+[20,30,43,37,49,55,63,72,82,96].map(v=>'<div class="bar" style="height:'+v+'%"></div>').join('')+'</div><div class="months">'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'].map(x=>'<span>'+x+'</span>').join('')+'</div>')+card('Customer segments','<div class="segments">'+[['Regular','38%'],['VIP','24%'],['New','18%'],['Atelier','12%'],['Inactive','8%']].map(([x,y])=>'<div class="segment"><span class="dot"></span>'+x+'<b>'+y+'</b></div>').join('')+'</div>')+'</div><div class="lower-grid">'+card('Recent customers',people.slice(0,4).map(p=>'<div class="customer-row"><div class="initials">'+initials(p.name)+'</div><div class="grow"><b class="truncate" style="display:block;font-size:12px">'+esc(p.name)+'</b><div class="muted small truncate">'+esc(p.email)+'</div></div>'+badge(p.tier)+'</div>').join(''),'<button class="link" data-go="customers">View all</button>')+card('Recent campaigns',campaigns.map(c=>'<div class="customer-row"><div class="grow"><b style="font-size:12px">'+esc(c.name)+'</b><div class="muted small">'+esc(c.audience)+'</div></div>'+badge(c.status)+'</div>').join(''),'<button class="link" data-go="campaigns">View all</button>')+'</div>'}
function directory(guests=false){let list=people.filter(p=>(segment==='All'||p.tier===segment)&&[p.name,p.email,p.phone,p.tier].join(' ').toLowerCase().includes(filter.toLowerCase()));return '<div class="toolbar"><input class="field field-search" id="directorySearch" value="'+esc(filter)+'" placeholder="⌕  Search name, email, phone..." aria-label="Search directory"><div class="filters">'+['All','New','VIP','Regular','Atelier'].map(x=>'<button class="chip '+(segment===x?'active':'')+'" data-segment="'+x+'">'+x+'</button>').join('')+'</div></div>'+card(guests?'Guest directory':'Customer directory',customerTable(list),'<span class="muted small">'+list.length+' demo records</span>')+(guests?'<p class="muted small">Guest editing is unavailable in this design preview. Actual guest records remain protected.</p>':'')}
function profile(){return '<div class="profile-grid"><div class="card"><div class="profile-center"><div class="profile-avatar">'+initials(selected.name)+'</div><h2>'+esc(selected.name)+'</h2><div style="margin-top:9px">'+badge(selected.tier)+'</div></div><div style="margin-top:20px">'+[['Email',selected.email],['Phone',selected.phone],['Customer ID',selected.id],['Email consent',selected.consent]].map(([a,b])=>'<div class="profile-fact"><span class="muted small">'+a+'</span><div style="margin-top:5px">'+esc(b)+'</div></div>').join('')+'</div></div><div><div class="card"><div class="tabs">'+['Overview','Purchases','Style Passport','Communication','Notes'].map(x=>'<button class="tab '+(profileTab===x?'active':'')+'" data-tab="'+x+'">'+x+'</button>').join('')+'</div>'+(profileTab==='Overview'?'<div class="stats-mini">'+[['Purchases',selected.visits],['Total spent',fmt(selected.spent)],['Segment',selected.tier]].map(([a,b])=>'<div class="card"><span class="muted small">'+a+'</span><strong>'+b+'</strong></div>').join('')+'</div>'+card('Style preferences','<p class="muted">'+esc(selected.style)+'</p>'):'<div class="empty">This section will be populated after secure CRM and POS integration.</div>')+'</div></div></div>'}
function campaignList(){return card('Campaigns','<div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Audience</th><th>Status</th><th></th></tr></thead><tbody>'+campaigns.map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.audience)+'</td><td>'+badge(c.status)+'</td><td><button class="link" data-go="composer">Preview →</button></td></tr>').join('')+'</tbody></table></div>')}
function composer(){return '<div class="campaign-layout">'+card('1. Choose audience','<div class="form-group"><label>Campaign name</label><input class="field" value="New Arrivals — October 2026" aria-label="Campaign name"></div><h3>Recipients</h3>'+[['All opted-in subscribers','Only guests with marketing consent'],['VIP customers','VIP segment with marketing consent'],['Birthday this month','Birthday segment with marketing consent'],['Custom list','Selected consented guests']].map(([a,b],i)=>'<label class="choice">'+svg('customers')+'<span class="grow"><b style="font-size:12px">'+a+'</b><span class="muted small" style="display:block;margin-top:4px">'+b+'</span></span><input type="radio" name="audience" '+(!i?'checked':'')+'></label>').join('')+'<p class="muted small">Sending disabled until Google OAuth, authentication and unsubscribe handling are completed.</p>')+card('2. Email preview','<div class="form-group"><label>Subject</label><input id="subject" class="field" value="New Arrivals at MATA Studio ✨" aria-label="Email subject"></div><div class="preview"><div class="preview-hero"><div class="brandline">MATA STUDIO</div><strong>NEW ARRIVALS</strong><div class="small">Timeless pieces for your everyday</div></div><div class="preview-body">Hi [First Name],<p>We are excited to share our latest collection — designed for your everyday style.</p><p class="muted small">Unsubscribe link will be required before sending.</p></div></div><p style="margin-top:14px"><button class="button" disabled>Send campaign · Not connected</button></p>')+'</div>'}
function placeholder(name,detail){return card(name,'<div class="empty">'+detail+'</div>')}
function render(){const titles={dashboard:'Dashboard',customers:'Customers',guests:'Guest Database',profile:'Customer Profile',purchases:'Purchases',style:'Style Passport',loyalty:'Loyalty',campaigns:'Email Campaigns',composer:'Create Campaign',reports:'Reports',settings:'Settings'};$('pageTitle').textContent=titles[view];$('nav').innerHTML=items.map(([k,l])=>'<button data-go="'+k+'" class="'+(view===k?'active':'')+'">'+svg(k)+'<span>'+l+'</span></button>').join('');$('pageAction').innerHTML=view==='profile'?'<button class="button secondary" data-go="customers">← Customers</button>':view==='campaigns'?'<button class="button" data-go="composer">+ New campaign</button>':view==='composer'?'<button class="button secondary" data-go="campaigns">← Campaigns</button>':'';$('content').innerHTML=view==='dashboard'?dashboard():view==='customers'?directory():view==='guests'?directory(true):view==='profile'?profile():view==='campaigns'?campaignList():view==='composer'?composer():placeholder(titles[view],{purchases:'POS purchase history will be read-only when securely connected.',style:'Style profiles will be available after staff authentication.',loyalty:'Rewards and ledger will be enabled after integration.',reports:'Reports will be available after live data is connected.',settings:'Staff access, Gmail connection and preferences will be configured here.'}[view]);const s=$('directorySearch');if(s){s.focus({preventScroll:true});s.setSelectionRange(s.value.length,s.value.length)}}
function closeMenu(){$('sidebar').classList.remove('open');$('overlay').classList.remove('open')}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]'),p=e.target.closest('[data-profile]'),seg=e.target.closest('[data-segment]'),tab=e.target.closest('[data-tab]');if(go){view=go.dataset.go;filter='';segment='All';closeMenu();render()}else if(p){selected=people.find(x=>x.id===p.dataset.profile)||people[0];view='profile';profileTab='Overview';render()}else if(seg){segment=seg.dataset.segment;render()}else if(tab){profileTab=tab.dataset.tab;render()}});
document.addEventListener('input',e=>{if(e.target.id==='directorySearch'){const pos=e.target.selectionStart;filter=e.target.value;render();const s=$('directorySearch');s.setSelectionRange(pos,pos)}});
$('menu').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('open')};$('closeMenu').onclick=closeMenu;$('overlay').onclick=closeMenu;render();
</script></body></html>
